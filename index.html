<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craftsman Studio | Handcrafted Woodwork & Custom Furniture</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN with Custom Theme Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#B45309', // Warm Amber primary accent
                            dark: '#92400E',
                            light: '#FDE68A',
                            surface: '#FAF9F6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom base styles for clean light-mode aesthetic */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAF9F6;
            color: #111827;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Fade-up initial state for scroll animations */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-[#FAF9F6] text-[#111827] antialiased selection:bg-brand-light selection:text-brand-dark">

    <!-- Navbar Section -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#FFFFFF]/90 backdrop-blur-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="#" class="flex items-center gap-2 text-xl font-bold font-heading tracking-tight text-[#111827]">
                <span class="w-10 h-10 rounded-lg bg-brand flex items-center justify-center text-white">
                    <i data-lucide="hammer" class="w-5 h-5"></i>
                </span>
                Craftsman Studio
            </a>

            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex items-center gap-8 font-medium text-sm text-[#4B5563]">
                <a href="#services" class="hover:text-brand transition-colors">Services</a>
                <a href="#about" class="hover:text-brand transition-colors">About</a>
                <a href="#portfolio" class="hover:text-brand transition-colors">Portfolio</a>
                <a href="#contact" class="hover:text-brand transition-colors">Contact</a>
            </nav>

            <!-- Desktop CTA Button -->
            <div class="hidden md:flex items-center gap-4">
                <a href="#contact" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-brand text-white font-medium text-sm hover:bg-brand-dark transition-colors shadow-sm">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    Get a Quote
                </a>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button id="menu-btn" class="md:hidden p-2 text-[#111827] focus:outline-none" aria-label="Toggle Menu">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden bg-[#FFFFFF] border-b border-gray-200 px-4 pt-2 pb-6 space-y-3">
            <a href="#services" class="block py-2 text-sm font-medium text-[#4B5563] hover:text-brand">Services</a>
            <a href="#about" class="block py-2 text-sm font-medium text-[#4B5563] hover:text-brand">About</a>
            <a href="#portfolio" class="block py-2 text-sm font-medium text-[#4B5563] hover:text-brand">Portfolio</a>
            <a href="#contact" class="block py-2 text-sm font-medium text-[#4B5563] hover:text-brand">Contact</a>
            <div class="pt-2">
                <a href="#contact" class="w-full flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg bg-brand text-white font-medium text-sm hover:bg-brand-dark transition-colors">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    Get a Quote
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="pt-20">
        <!-- Hero section and other pages will go here -->
    </main>

    <!-- Initialize Lucide Icons & Mobile Menu -->
    <script>
        lucide.createIcons();

        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        mobileMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
